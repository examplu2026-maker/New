<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPlus</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eef4ff, #ffffff);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
    }

    .login-card {
        background: white;
        border-radius: 22px;
        padding: 30px 25px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        border-radius: 20px;
        background: #1769e0;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
    }

    h1 {
        text-align: center;
        color: #1769e0;
        font-size: 30px;
        margin-bottom: 6px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 28px;
    }

    label {
        display: block;
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .input-group {
        margin-bottom: 18px;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #d7dce5;
        border-radius: 12px;
        outline: none;
        font-size: 16px;
        background: #fafbfc;
    }

    input:focus {
        border-color: #1769e0;
        background: white;
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 55px;
    }

    .show-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 13px;
        color: #1769e0;
        font-weight: bold;
    }

    .login-button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 15px;
        background: #1769e0;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
    }

    .login-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
    }

    .message {
        margin-top: 18px;
        padding: 12px;
        border-radius: 10px;
        display: none;
        text-align: center;
        font-size: 14px;
        line-height: 1.4;
    }

    .error {
        display: block;
        background: #ffe9e9;
        color: #b00020;
    }

    .success {
        display: block;
        background: #e8f8ed;
        color: #137333;
    }

    .dashboard {
        display: none;
        background: white;
        border-radius: 22px;
        padding: 25px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .top {
        text-align: center;
        margin-bottom: 25px;
    }

    .top h2 {
        color: #1769e0;
        margin-bottom: 7px;
    }

    .welcome {
        color: #555;
        font-size: 14px;
    }

    .role-box {
        background: #eef4ff;
        border-radius: 15px;
        padding: 18px;
        margin-bottom: 18px;
    }

    .role-box strong {
        color: #1769e0;
    }

    .dashboard-button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #1769e0;
        color: white;
        font-size: 15px;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
    }

    .logout {
        background: #555;
    }

    .footer {
        text-align: center;
        color: #999;
        font-size: 12px;
        margin-top: 20px;
    }

    @media (max-width: 400px) {
        .login-card,
        .dashboard {
            padding: 23px 18px;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div class="login-card" id="loginCard">

        <div class="logo">EP</div>

        <h1>ExamPlus</h1>

        <div class="subtitle">
            School Management System
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="username"
            >
        </div>

        <div class="input-group">

            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    id="showPasswordButton"
                >
                    Show
                </button>

            </div>
        </div>

        <button
            class="login-button"
            id="loginButton"
            onclick="login()"
        >
            Login
        </button>

        <div id="message" class="message"></div>

        <div class="footer">
            © 2026 ExamPlus
        </div>

    </div>


    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">

        <div class="top">

            <div class="logo">EP</div>

            <h2>Welcome to ExamPlus</h2>

            <div class="welcome" id="welcomeText"></div>

        </div>

        <div class="role-box">

            <div>
                <strong>Role:</strong>
                <span id="userRole"></span>
            </div>

            <div style="margin-top:8px;">
                <strong>School:</strong>
                <span id="userSchool"></span>
            </div>

        </div>

        <div id="dashboardContent"></div>

        <button
            class="dashboard-button logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</div>


<script>

/* =========================================================
   EXAMPLUS BACKEND
   ========================================================= */

const API =
"https://script.google.com/macros/s/AKfycby_vtghiScwJGAUXhfBdf9vMiFrKMexW4sjln0Vk6IjfxjBr0rDx-5MBtv4Pc25eeENEw/exec";


/* =========================================================
   PASSWORD SHOW / HIDE
   ========================================================= */

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showPasswordButton");


    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";
    }
}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;
}


/* =========================================================
   LOGIN
   ========================================================= */

function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if (!email) {

        showMessage(
            "Please enter your email address.",
            "error"
        );

        return;
    }


    if (!password) {

        showMessage(
            "Please enter your password.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("loginButton");


    button.disabled = true;
    button.textContent = "Logging in...";


    showMessage(
        "Connecting to ExamPlus server...",
        "success"
    );


    const callbackName =
        "examPlusLogin_" + Date.now();


    window[callbackName] =
        function(response) {

            try {

                if (
                    response &&
                    response.success === true
                ) {

                    showMessage(
                        "Login successful.",
                        "success"
                    );

                    setTimeout(function() {

                        showDashboard(
                            response.user
                        );

                    }, 500);

                } else {

                    showMessage(
                        response &&
                        response.message
                            ? response.message
                            : "Login failed.",
                        "error"
                    );
                }

            } finally {

                button.disabled = false;
                button.textContent = "Login";

                delete window[callbackName];

                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
            }
        };


    const script =
        document.createElement("script");


    script.src =
        API +
        "?action=login" +
        "&email=" +
        encodeURIComponent(email) +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {

            showMessage(
                "Unable to connect to the ExamPlus server.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Login";

            delete window[callbackName];

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }
        };


    document.body.appendChild(script);


    setTimeout(function() {

        if (
            typeof window[callbackName] ===
            "function"
        ) {

            showMessage(
                "The server did not respond. Please try again.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Login";

            delete window[callbackName];

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }
        }

    }, 15000);
}


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

function showDashboard(user) {

    document.getElementById("loginCard")
        .style.display = "none";


    document.getElementById("dashboard")
        .style.display = "block";


    document.getElementById("welcomeText")
        .textContent =
        user.email;


    document.getElementById("userRole")
        .textContent =
        user.role;


    document.getElementById("userSchool")
        .textContent =
        user.schoolName || "ExamPlus";


    const content =
        document.getElementById(
            "dashboardContent"
        );


    const role =
        String(user.role || "")
        .toLowerCase();


    if (role === "super admin") {

        content.innerHTML = `

            <button
                class="dashboard-button"
                onclick="comingSoon('Create School')"
            >
                🏫 Create School
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('View Schools')"
            >
                🏢 View Schools
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('System Settings')"
            >
                ⚙️ System Settings
            </button>

        `;

    } else if (role === "admin") {

        content.innerHTML = `

            <button
                class="dashboard-button"
                onclick="comingSoon('School Details')"
            >
                🏫 School Details
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('Students')"
            >
                👨‍🎓 Students
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('Classes')"
            >
                📚 Classes
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('Subjects')"
            >
                📖 Subjects
            </button>

        `;

    } else if (role === "teacher") {

        content.innerHTML = `

            <button
                class="dashboard-button"
                onclick="comingSoon('Add Score')"
            >
                📝 Add Score
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('View Record')"
            >
                📊 View Record
            </button>

        `;

    } else if (role === "bursar") {

        content.innerHTML = `

            <button
                class="dashboard-button"
                onclick="comingSoon('Payment')"
            >
                💰 Payment
            </button>

            <button
                class="dashboard-button"
                onclick="comingSoon('View Records')"
            >
                🧾 View Records
            </button>

        `;

    } else {

        content.innerHTML = `
            <p style="text-align:center;color:#777;">
                Dashboard for this role is not yet configured.
            </p>
        `;
    }
}


/* =========================================================
   TEMPORARY BUTTON MESSAGE
   ========================================================= */

function comingSoon(name) {

    alert(
        name +
        " will be connected next."
    );
}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    document.getElementById("dashboard")
        .style.display = "none";


    document.getElementById("loginCard")
        .style.display = "block";


    document.getElementById("email")
        .value = "";


    document.getElementById("password")
        .value = "";


    document.getElementById("message")
        .className = "message";


    document.getElementById("message")
        .textContent = "";
}

</script>

</body>
</html>
