<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPlus Test</title>
</head>

<body style="font-family:Arial;text-align:center;padding:40px;">

<h2>ExamPlus Backend Test</h2>

<button onclick="testBackend()"
style="padding:15px 25px;font-size:18px;">
TEST BACKEND
</button>

<p id="result">Waiting...</p>

<script>

function testBackend() {

  document.getElementById("result").innerHTML =
    "Connecting...";

  var iframe = document.createElement("iframe");

  iframe.style.display = "none";

  iframe.src =
  "https://script.google.com/macros/s/AKfycbxcMui-9QoUd9643Lca7Ss3BGPc2PvUn2fnIh2mEfTM7DvTngo6eJkH3OuDrX1xxVEK4Q/exec";

  document.body.appendChild(iframe);

  setTimeout(function() {

    document.getElementById("result").innerHTML =
      "The Apps Script page was requested.";

  },5000);

}

</script>

</body>
</html>
