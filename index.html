<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAMPLUS — School Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#4B5670;
    --paper:#F6F4EF;
    --card:#FFFFFF;
    --line:#E4E0D6;
    --gold:#B8863B;
    --gold-soft:#F1E4C9;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.brand{font-family:'Fraunces',serif;}

  /* header */
  header{
    padding:28px 20px 20px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;
  }
  .brand{font-size:18px;font-weight:600;letter-spacing:0.2px;}
  .brand span{color:var(--gold);}
  #greeting{
    margin:0 0 2px;
    font-size:26px;
    font-weight:600;
    line-height:1.25;
  }
  .subline{margin:0;color:var(--ink-soft);font-size:14.5px;}

  main{padding:22px 20px 60px;max-width:720px;margin:0 auto;}

  /* home view */
  .section-label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:26px 0 10px;
    font-weight:600;
  }
  .section-label:first-child{margin-top:0;}

  .role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .role-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:inherit;
    opacity:0;
    animation:rise .5s ease forwards;
  }
  .role-card:active{transform:scale(0.98);}
  .role-icon{
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink);
  }
  .role-title{font-weight:500;font-size:13.5px;line-height:1.3;}

  .account-row{
    display:flex;gap:12px;
  }
  .account-link{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
  }
  .account-link i{color:var(--gold);font-size:16px;}

  /* detail view */
  #detailView{display:none;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;
    color:var(--ink-soft);
    font-family:inherit;font-size:14px;font-weight:500;
    padding:0 0 18px;cursor:pointer;
  }
  .detail-head{
    display:flex;align-items:center;gap:14px;
    margin-bottom:22px;
  }
  #detailIcon{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;background:var(--ink);
  }
  #detailTitle{margin:0;font-size:22px;font-weight:600;}

  .sub-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .sub-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 14px;
    display:flex;flex-direction:column;gap:12px;
    text-decoration:none;color:var(--ink);
    opacity:0;animation:rise .45s ease forwards;
  }
  .sub-card .icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);border:1px solid var(--line);
    color:var(--ink);font-size:15px;
  }
  .sub-card .label{font-size:13.5px;font-weight:500;line-height:1.3;}

  @keyframes rise{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .role-card,.sub-card{animation:none;opacity:1;}
  }

  @media (min-width:480px){
    main{max-width:480px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand-mark">E+</div>
    <div class="brand">EXAM<span>PLUS</span></div>
  </div>
  <h1 id="greeting">Good day</h1>
  <p class="subline">What would you like to do?</p>
</header>

<main>

  <div id="homeView">
    <div class="role-grid" id="grid-home"></div>

    <div class="section-label">Get Started</div>
    <div class="account-row">
      <a class="account-link" href="signup.html"><i class="fa-solid fa-user-plus"></i> Sign Up</a>
      <a class="account-link" href="activate.html"><i class="fa-solid fa-circle-check"></i> Activate</a>
    </div>
  </div>

  <div id="detailView">
    <button class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <div class="detail-head">
      <div id="detailIcon"></div>
      <h2 id="detailTitle"></h2>
    </div>
    <div class="sub-grid" id="subGrid"></div>
  </div>

</main>

<script>
  const GROUPS = {
    superadmin: {
      title: "Super Admin",
      icon: "fa-solid fa-user-shield",
      pages: [
        { file: "create-school.html", title: "Create School", icon: "fa-solid fa-school-circle-check" },
        { file: "view-schools.html",  title: "View Schools",  icon: "fa-solid fa-building-columns" },
        { file: "settings.html",      title: "System Settings", icon: "fa-solid fa-gear" }
      ]
    },
    schooladmin: {
      title: "School Admin",
      icon: "fa-solid fa-building-user",
      pages: [
        { file: "school.html",        title: "School Details",  icon: "fa-solid fa-school" },
        { file: "students.html",      title: "Students",        icon: "fa-solid fa-user-graduate" },
        { file: "classes.html",       title: "Classes",         icon: "fa-solid fa-layer-group" },
        { file: "subjects.html",      title: "Subjects",        icon: "fa-solid fa-book" },
        { file: "students-bulk.html", title: "Bulk Students",   icon: "fa-solid fa-users" },
        { file: "report.html",        title: "Report Card",     icon: "fa-solid fa-file-lines" },
        { file: "contacts.html",      title: "Contact Us",      icon: "fa-solid fa-address-book" }
      ]
    },
    teacher: {
      title: "Teacher",
      icon: "fa-solid fa-chalkboard-user",
      pages: [
        { file: "teacher-bursar.html",   title: "Staff Dashboard", icon: "fa-solid fa-id-badge" },
        { file: "upload-result.html",    title: "Upload Result",   icon: "fa-solid fa-upload" },
        { file: "view-results.html",     title: "View Results",    icon: "fa-solid fa-eye" }
      ]
    },
    bursar: {
      title: "Bursar",
      icon: "fa-solid fa-money-check-dollar",
      pages: [
        { file: "teacher-bursar.html",   title: "Staff Dashboard", icon: "fa-solid fa-id-badge" },
        { file: "generate-receipt.html", title: "Generate Receipt",icon: "fa-solid fa-receipt" },
        { file: "receipt-history.html",  title: "Receipt History", icon: "fa-solid fa-clock-rotate-left" }
      ]
    }
  };

  const homeView = document.getElementById('homeView');
  const detailView = document.getElementById('detailView');
  const detailIcon = document.getElementById('detailIcon');
  const detailTitle = document.getElementById('detailTitle');
  const subGrid = document.getElementById('subGrid');
  const backBtn = document.getElementById('backBtn');

  const homeGrid = document.getElementById('grid-home');

  homeGrid.innerHTML = Object.entries(GROUPS).map(([key, group], i) => `
    <button class="role-card" data-role="${key}" style="animation-delay:${(i*0.05).toFixed(2)}s">
      <div class="role-icon"><i class="${group.icon}"></i></div>
      <span class="role-title">${group.title}</span>
    </button>
  `).join('');

  document.querySelectorAll('.role-card').forEach(btn => {
    btn.addEventListener('click', () => openGroup(btn.dataset.role));
  });

  function openGroup(key){
    const group = GROUPS[key];
    if (!group) return;

    detailIcon.innerHTML = `<i class="${group.icon}"></i>`;
    detailTitle.textContent = group.title;

    subGrid.innerHTML = group.pages.map((p, i) => `
      <a class="sub-card" href="${p.file}" style="animation-delay:${(i*0.05).toFixed(2)}s">
        <div class="icon"><i class="${p.icon}"></i></div>
        <span class="label">${p.title}</span>
      </a>
    `).join('');

    homeView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  backBtn.addEventListener('click', () => {
    detailView.style.display = 'none';
    homeView.style.display = 'block';
  });

  /* time-based greeting */
  const hour = new Date().getHours();
  document.getElementById('greeting').textContent =
    hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
</script>

</body>
</html>
