<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPlus</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
  min-height:100vh;
}

/* ================= LOGIN ================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0b5ed7,#073b8f);
}

.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:22px;
  padding:30px 25px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.logo{
  width:78px;
  height:78px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#0b5ed7;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
}

.login-card h1{
  text-align:center;
  color:#0b5ed7;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0b5ed7;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:10px;
  top:10px;
  border:0;
  background:none;
  color:#0b5ed7;
  font-weight:bold;
}

.login-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#0b5ed7;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.login-btn:disabled{
  opacity:.6;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  text-align:center;
  font-size:14px;
}

.message.error{
  display:block;
  background:#ffe5e5;
  color:#b00020;
}

.message.success{
  display:block;
  background:#e5f8eb;
  color:#08752d;
}

.loading{
  display:none;
  text-align:center;
  color:#0b5ed7;
  padding:12px;
  font-size:14px;
}


/* ================= APP ================= */

#app{
  display:none;
  min-height:100vh;
}

.topbar{
  background:#0b5ed7;
  color:white;
  padding:15px 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.topbar-title{
  font-size:21px;
  font-weight:bold;
}

.topbar-user{
  font-size:12px;
  margin-top:3px;
  opacity:.9;
}

.content{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.welcome{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.welcome h2{
  color:#0b5ed7;
  margin-bottom:5px;
}

.welcome p{
  color:#777;
  font-size:14px;
}


/* ================= ICONS ================= */

.icon-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.icon-card{
  border:0;
  background:white;
  border-radius:18px;
  padding:22px 10px;
  min-height:150px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  cursor:pointer;
}

.icon-card:active{
  transform:scale(.97);
}

.icon-circle{
  width:68px;
  height:68px;
  margin:0 auto 12px;
  border-radius:18px;
  background:#eaf2ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
}

.icon-card h3{
  font-size:16px;
  color:#222;
}

.icon-card p{
  font-size:11px;
  color:#888;
  margin-top:5px;
}


/* ================= PAGES ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.back-button{
  border:0;
  background:#e8f1ff;
  color:#0b5ed7;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:17px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
  color:#0b5ed7;
  margin-bottom:18px;
}

.save-button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#0b5ed7;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
}

.logout-button{
  width:100%;
  padding:14px;
  margin-top:25px;
  border:0;
  border-radius:10px;
  background:#dc3545;
  color:white;
  font-weight:bold;
}


/* ================= SCHOOL LIST ================= */

.school-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.school-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.school-item h3{
  color:#0b5ed7;
  margin-bottom:8px;
}

.school-item p{
  font-size:13px;
  margin:5px 0;
  color:#555;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e5f8eb;
  color:#08752d;
  font-size:11px;
  font-weight:bold;
}


/* ================= SETTINGS ================= */

.settings-box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.settings-box h3{
  margin-bottom:12px;
}

.plan{
  padding:10px;
  background:#f5f8fc;
  border-radius:8px;
  margin:6px 0;
  font-size:14px;
}


/* ================= MOBILE ================= */

@media(max-width:380px){

  .content{
    padding:15px;
  }

  .icon-grid{
    gap:10px;
  }

  .icon-card{
    min-height:140px;
  }

}
</style>
</head>

<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div id="loginPage">

  <div class="login-card">

    <div class="logo">EP</div>

    <h1>ExamPlus</h1>

    <div class="subtitle">
      School Management System
    </div>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

      <div class="form-group">

        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>


      <div
        id="loginLoading"
        class="loading"
      >
        Logging in...
      </div>

    </form>

  </div>

</div>



<!-- ==================================================
     APPLICATION
================================================== -->

<div id="app">

  <div class="topbar">

    <div class="topbar-title">
      ExamPlus
    </div>

    <div
      class="topbar-user"
      id="topUser"
    ></div>

  </div>


  <div class="content">


    <!-- ==================================================
         HOME / ICON DASHBOARD
    ================================================== -->

    <div
      id="homePage"
      class="page active"
    >

      <div class="welcome">

        <h2 id="welcomeText">
          Welcome
        </h2>

        <p id="schoolText">
          ExamPlus
        </p>

      </div>


      <div class="icon-grid">


        <!-- CREATE SCHOOL -->

        <button
          class="icon-card"
          onclick="showPage('createSchoolPage')"
        >

          <div class="icon-circle">
            🏫
          </div>

          <h3>
            Create School
          </h3>

          <p>
            Register a new school
          </p>

        </button>



        <!-- VIEW SCHOOLS -->

        <button
          class="icon-card"
          onclick="showPage('viewSchoolsPage'); loadSchools()"
        >

          <div class="icon-circle">
            🏢
          </div>

          <h3>
            View Schools
          </h3>

          <p>
            View all registered schools
          </p>

        </button>



        <!-- SETTINGS -->

        <button
          class="icon-card"
          onclick="showPage('settingsPage')"
        >

          <div class="icon-circle">
            ⚙️
          </div>

          <h3>
            Settings
          </h3>

          <p>
            Subscription and payment settings
          </p>

        </button>


      </div>


      <button
        class="logout-button"
        onclick="logout()"
      >
        Logout
      </button>

    </div>



    <!-- ==================================================
         CREATE SCHOOL
    ================================================== -->

    <div
      id="createSchoolPage"
      class="page"
    >

      <button
        class="back-button"
        onclick="showPage('homePage')"
      >
        ← Back
      </button>


      <div class="card">

        <h2>
          🏫 Create School
        </h2>


        <div
          id="schoolMessage"
          class="message"
        ></div>


        <div class="form-group">

          <label>
            School Name
          </label>

          <input
            type="text"
            id="newSchoolName"
            placeholder="Enter school name"
          >

        </div>


        <div class="form-group">

          <label>
            Admin Email
          </label>

          <input
            type="email"
            id="newSchoolEmail"
            placeholder="Enter school admin email"
          >

        </div>


        <div class="form-group">

          <label>
            Admin Password
          </label>

          <input
            type="password"
            id="newSchoolPassword"
            placeholder="Enter admin password"
          >

        </div>


        <button
          class="save-button"
          onclick="createSchool()"
          id="createButton"
        >
          Save School
        </button>


        <div
          id="schoolLoading"
          class="loading"
        >
          Creating school...
        </div>

      </div>

    </div>



    <!-- ==================================================
         VIEW SCHOOLS
    ================================================== -->

    <div
      id="viewSchoolsPage"
      class="page"
    >

      <button
        class="back-button"
        onclick="showPage('homePage')"
      >
        ← Back
      </button>


      <div class="card">

        <h2>
          🏢 View Schools
        </h2>


        <div
          id="schoolsLoading"
          class="loading"
        >
          Loading schools...
        </div>


        <div
          id="schoolsList"
          class="school-list"
        ></div>

      </div>

    </div>



    <!-- ==================================================
         SETTINGS
    ================================================== -->

    <div
      id="settingsPage"
      class="page"
    >

      <button
        class="back-button"
        onclick="showPage('homePage')"
      >
        ← Back
      </button>


      <div class="card">

        <h2>
          ⚙️ Settings
        </h2>


        <!-- SUBSCRIPTION -->

        <div class="settings-box">

          <h3>
            Subscription
          </h3>

          <div class="plan">
            Free Trial — 1 Week
          </div>

          <div class="plan">
            1 Term — ₦8,000
          </div>

          <div class="plan">
            2 Terms — ₦14,000
          </div>

          <div class="plan">
            1 Session — ₦20,000
          </div>

        </div>


        <!-- BANK -->

        <div class="settings-box">

          <h3>
            Bank Payment
          </h3>

          <div class="form-group">

            <label>
              Account Number
            </label>

            <input
              type="text"
              placeholder="Account Number"
            >

          </div>


          <div class="form-group">

            <label>
              Account Name
            </label>

            <input
              type="text"
              placeholder="Account Name"
            >

          </div>


          <div class="form-group">

            <label>
              Bank Name
            </label>

            <input
              type="text"
              placeholder="Bank Name"
            >

          </div>


          <div class="form-group">

            <label>
              WhatsApp / Phone
            </label>

            <input
              type="text"
              placeholder="WhatsApp or phone number"
            >

          </div>


          <button class="save-button">
            Save Bank Settings
          </button>

        </div>


        <!-- ONLINE PAYMENT -->

        <div class="settings-box">

          <h3>
            Online Payment
          </h3>


          <div class="form-group">

            <label>
              Payment Provider
            </label>

            <select>

              <option>
                Paystack
              </option>

              <option>
                None
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Public Key
            </label>

            <input
              type="text"
              placeholder="Public Key"
            >

          </div>


          <div class="form-group">

            <label>
              Secret Key
            </label>

            <input
              type="password"
              placeholder="Secret Key"
            >

          </div>


          <button class="save-button">
            Save Online Payment
          </button>

        </div>

      </div>

    </div>


  </div>

</div>



<script>

/* ==================================================
   BACKEND URL
================================================== */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwENOjw2BKVWHxsAXNFokNenNMu5-pA57HRW0C5vnnnq5Cji2jLzxS75DlOGrWPUViwwg/exec";


/* ==================================================
   PASSWORD
================================================== */

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");


  if(password.type === "password"){

    password.type = "text";
    button.textContent = "Hide";

  }else{

    password.type = "password";
    button.textContent = "Show";

  }

}


/* ==================================================
   LOGIN
================================================== */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

  e.preventDefault();


  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;


  const button =
    document.getElementById("loginButton");

  const loading =
    document.getElementById("loginLoading");


  button.disabled = true;

  loading.style.display = "block";


  try{

    const url =
      BACKEND_URL +
      "?action=login" +
      "&email=" +
      encodeURIComponent(email) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if(!result.success){

      showLoginMessage(
        result.message ||
        "Invalid email or password.",
        "error"
      );

      return;

    }


    localStorage.setItem(
      "examplusUser",
      JSON.stringify(result)
    );


    openApp(result);


  }catch(error){

    console.error(error);

    showLoginMessage(
      "Unable to connect to ExamPlus server.",
      "error"
    );

  }finally{

    button.disabled = false;

    loading.style.display = "none";

  }

});


/* ==================================================
   LOGIN MESSAGE
================================================== */

function showLoginMessage(text,type){

  const box =
    document.getElementById("loginMessage");

  box.textContent = text;

  box.className =
    "message " + type;

}


/* ==================================================
   OPEN APPLICATION
================================================== */

function openApp(user){

  document.getElementById("loginPage")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";


  document.getElementById("topUser")
    .textContent =
      user.role || "";


  document.getElementById("welcomeText")
    .textContent =
      "Welcome, " +
      (user.role || "User");


  document.getElementById("schoolText")
    .textContent =
      user.schoolName ||
      "ExamPlus";


  showPage("homePage");

}


/* ==================================================
   PAGE NAVIGATION
================================================== */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(function(page){

      page.classList.remove("active");

    });


  const page =
    document.getElementById(pageId);


  if(page){

    page.classList.add("active");

  }


  window.scrollTo(0,0);

}


/* ==================================================
   CREATE SCHOOL
================================================== */

async function createSchool(){

  const name =
    document.getElementById("newSchoolName")
    .value.trim();

  const email =
    document.getElementById("newSchoolEmail")
    .value.trim();

  const password =
    document.getElementById("newSchoolPassword")
    .value;


  const message =
    document.getElementById("schoolMessage");

  const button =
    document.getElementById("createButton");

  const loading =
    document.getElementById("schoolLoading");


  if(!name || !email || !password){

    message.textContent =
      "Please fill all fields.";

    message.className =
      "message error";

    return;

  }


  button.disabled = true;

  loading.style.display = "block";

  message.style.display = "none";


  try{

    const url =
      BACKEND_URL +
      "?action=createSchool" +
      "&schoolName=" +
      encodeURIComponent(name) +
      "&email=" +
      encodeURIComponent(email) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if(result.success){

      message.textContent =
        "School created successfully.";

      message.className =
        "message success";


      document.getElementById("newSchoolName")
        .value = "";

      document.getElementById("newSchoolEmail")
        .value = "";

      document.getElementById("newSchoolPassword")
        .value = "";

    }else{

      message.textContent =
        result.message ||
        "Unable to create school.";

      message.className =
        "message error";

    }


  }catch(error){

    console.error(error);

    message.textContent =
      "Unable to connect to the server.";

    message.className =
      "message error";

  }finally{

    button.disabled = false;

    loading.style.display = "none";

  }

}


/* ==================================================
   VIEW SCHOOLS
================================================== */

async function loadSchools(){

  const list =
    document.getElementById("schoolsList");

  const loading =
    document.getElementById("schoolsLoading");


  list.innerHTML = "";

  loading.style.display = "block";


  /*
    We will connect this screen to the
    Schools sheet in the next backend step.
  */

  setTimeout(function(){

    loading.style.display = "none";


    list.innerHTML =
      "<div class='school-item'>" +
      "<h3>Schools</h3>" +
      "<p>The school list is ready for the backend connection.</p>" +
      "</div>";

  },500);

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  localStorage.removeItem(
    "examplusUser"
  );


  document.getElementById("app")
    .style.display = "none";


  document.getElementById("loginPage")
    .style.display = "flex";


  document.getElementById("email")
    .value = "";

  document.getElementById("password")
    .value = "";


  showPage("homePage");

}


/* ==================================================
   RESTORE LOGIN
================================================== */

window.addEventListener("load",function(){

  const saved =
    localStorage.getItem(
      "examplusUser"
    );


  if(saved){

    try{

      const user =
        JSON.parse(saved);


      if(user.success){

        openApp(user);

      }

    }catch(error){

      localStorage.removeItem(
        "examplusUser"
      );

    }

  }

});

</script>

</body>
</html>
