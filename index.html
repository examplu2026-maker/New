<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPlus School Management System</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

button,input,select,textarea{
  font:inherit;
}

.hidden{
  display:none !important;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo-title{
  text-align:center;
  margin-bottom:25px;
}

.logo-title .icon{
  font-size:55px;
}

.logo-title h1{
  color:#0d47a1;
  font-size:30px;
  margin-top:5px;
}

.logo-title p{
  color:#777;
  margin-top:5px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
  color:#374151;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 3px rgba(25,118,210,.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:85px;
}

.show-password{
  position:absolute;
  right:8px;
  top:7px;
  border:none;
  background:#eef4ff;
  color:#0d47a1;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.primary-btn{
  width:100%;
  border:none;
  background:#0d47a1;
  color:white;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:5px;
}

.primary-btn:hover{
  background:#083b88;
}

.message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  display:none;
}

.message.error{
  display:block;
  background:#ffebee;
  color:#c62828;
}

.message.success{
  display:block;
  background:#e8f5e9;
  color:#2e7d32;
}

/* APP */
#appPage{
  min-height:100vh;
}

.topbar{
  background:#0d47a1;
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.user-info{
  text-align:right;
  font-size:12px;
}

.user-info strong{
  display:block;
  font-size:13px;
}

.logout-btn{
  border:none;
  background:#ef5350;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  margin-left:8px;
}

.dashboard{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.welcome{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.welcome h2{
  color:#0d47a1;
  margin-bottom:5px;
}

.school-name-display{
  color:#666;
}

.section-title{
  margin:22px 0 12px;
  color:#374151;
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.tile{
  background:white;
  border:none;
  min-height:135px;
  border-radius:16px;
  padding:18px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:.2s;
}

.tile:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(0,0,0,.12);
}

.tile .tile-icon{
  font-size:38px;
  margin-bottom:12px;
}

.tile h3{
  font-size:16px;
  color:#1f2937;
  margin-bottom:5px;
}

.tile p{
  color:#777;
  font-size:12px;
}

.placeholder{
  opacity:.75;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:22px;
  position:relative;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

.modal-header h2{
  color:#0d47a1;
  font-size:21px;
}

.close-btn{
  border:none;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

.secondary-btn{
  border:none;
  background:#e5e7eb;
  color:#374151;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.save-btn{
  border:none;
  background:#0d47a1;
  color:white;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

/* SCHOOL LOGO */
.logo-upload-area{
  border:2px dashed #b8c7dd;
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#f8fbff;
  margin-top:8px;
}

.logo-preview{
  width:120px;
  height:120px;
  border-radius:12px;
  border:1px solid #ddd;
  object-fit:contain;
  background:white;
  display:none;
  margin:0 auto 12px;
}

.logo-placeholder{
  color:#777;
  font-size:13px;
  margin-bottom:12px;
}

.file-input{
  width:100%;
  padding:8px;
}

/* SCHOOL CARDS */
.school-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  background:#fafafa;
}

.school-card h3{
  color:#0d47a1;
  margin-bottom:8px;
}

.school-card p{
  font-size:13px;
  margin:4px 0;
  color:#555;
}

/* SETTINGS */
.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px 15px;
}

.settings-grid .full{
  grid-column:1/-1;
}

@media(max-width:600px){
  .topbar{
    flex-wrap:wrap;
  }

  .user-info{
    order:3;
    width:100%;
    text-align:left;
  }

  .tiles{
    grid-template-columns:repeat(2,1fr);
  }

  .tile{
    min-height:125px;
    padding:14px;
  }

  .tile .tile-icon{
    font-size:32px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:380px){
  .tiles{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="loginPage">

  <div class="login-box">

    <div class="logo-title">
      <div class="icon">🎓</div>
      <h1>ExamPlus</h1>
      <p>School Management System</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>
        </div>
      </div>

      <button class="primary-btn" type="submit">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </form>

  </div>

</div>


<!-- ================= APP PAGE ================= -->
<div id="appPage" class="hidden">

  <div class="topbar">

    <div class="brand">
      🎓 ExamPlus
    </div>

    <div class="user-info">
      <strong id="topUserEmail"></strong>
      <span id="topUserRole"></span>
    </div>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>


  <main class="dashboard">

    <div class="welcome">

      <h2 id="welcomeTitle">
        Welcome
      </h2>

      <div
        class="school-name-display"
        id="welcomeSchool"
      ></div>

    </div>


    <!-- ================= SUPER ADMIN ================= -->

    <section id="superAdminSection" class="hidden">

      <h3 class="section-title">
        Super Admin Dashboard
      </h3>

      <div class="tiles">

        <button class="tile" onclick="openCreateSchool()">
          <div class="tile-icon">🏫</div>
          <h3>Create School</h3>
          <p>Create a new school</p>
        </button>

        <button class="tile" onclick="openViewSchools()">
          <div class="tile-icon">🏢</div>
          <h3>View Schools</h3>
          <p>View registered schools</p>
        </button>

        <button class="tile" onclick="openSystemSettings()">
          <div class="tile-icon">⚙️</div>
          <h3>System Settings</h3>
          <p>Configure ExamPlus</p>
        </button>

      </div>

    </section>


    <!-- ================= SCHOOL ADMIN ================= -->

    <section id="adminSection" class="hidden">

      <h3 class="section-title">
        School Admin Dashboard
      </h3>

      <div class="tiles">

        <button class="tile" onclick="openSchoolDetails()">
          <div class="tile-icon">🏫</div>
          <h3>School Details</h3>
          <p>Manage school information</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Students Details')">
          <div class="tile-icon">👨‍🎓</div>
          <h3>Students Details</h3>
          <p>Manage students</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('All Classes')">
          <div class="tile-icon">📚</div>
          <h3>All Classes</h3>
          <p>Create and manage classes</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('All Subjects')">
          <div class="tile-icon">📖</div>
          <h3>All Subjects</h3>
          <p>Manage school subjects</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Students in Bulk')">
          <div class="tile-icon">👥</div>
          <h3>Students in Bulk</h3>
          <p>Add students in bulk</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Report Card')">
          <div class="tile-icon">📄</div>
          <h3>Report Card</h3>
          <p>Generate report cards</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Settings')">
          <div class="tile-icon">⚙️</div>
          <h3>Settings</h3>
          <p>School settings</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Contact Us')">
          <div class="tile-icon">📞</div>
          <h3>Contact Us</h3>
          <p>Contact Super Admin</p>
        </button>

      </div>

    </section>


    <!-- ================= TEACHER ================= -->

    <section id="teacherSection" class="hidden">

      <h3 class="section-title">
        Teacher Dashboard
      </h3>

      <div class="tiles">

        <button class="tile placeholder" onclick="comingSoon('Upload Result')">
          <div class="tile-icon">📝</div>
          <h3>Upload Result</h3>
          <p>Enter student scores</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('View Results')">
          <div class="tile-icon">📊</div>
          <h3>View Results</h3>
          <p>View student results</p>
        </button>

      </div>

    </section>


    <!-- ================= BURSAR ================= -->

    <section id="bursarSection" class="hidden">

      <h3 class="section-title">
        Bursar Dashboard
      </h3>

      <div class="tiles">

        <button class="tile placeholder" onclick="comingSoon('Generate Receipt')">
          <div class="tile-icon">🧾</div>
          <h3>Generate Receipt</h3>
          <p>Record student payment</p>
        </button>

        <button class="tile placeholder" onclick="comingSoon('Receipt History')">
          <div class="tile-icon">📜</div>
          <h3>Receipt History</h3>
          <p>View payment records</p>
        </button>

      </div>

    </section>

  </main>

</div>


<!-- ================= CREATE SCHOOL MODAL ================= -->

<div id="createSchoolModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>🏫 Create School</h2>

      <button
        class="close-btn"
        onclick="closeModal('createSchoolModal')"
      >
        ×
      </button>
    </div>

    <form id="createSchoolForm">

      <div class="form-group">
        <label>School Name</label>
        <input
          type="text"
          id="newSchoolName"
          required
        >
      </div>

      <div class="form-group">
        <label>Admin Email</label>
        <input
          type="email"
          id="newAdminEmail"
          required
        >
      </div>

      <div class="form-group">
        <label>Admin Password</label>
        <input
          type="password"
          id="newAdminPassword"
          required
        >
      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="secondary-btn"
          onclick="closeModal('createSchoolModal')"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
        >
          Create School
        </button>

      </div>

      <div id="createSchoolMessage" class="message"></div>

    </form>

  </div>

</div>


<!-- ================= VIEW SCHOOLS MODAL ================= -->

<div id="viewSchoolsModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>🏢 Registered Schools</h2>

      <button
        class="close-btn"
        onclick="closeModal('viewSchoolsModal')"
      >
        ×
      </button>

    </div>

    <div id="schoolsList">
      Loading...
    </div>

  </div>

</div>


<!-- ================= SYSTEM SETTINGS MODAL ================= -->

<div id="systemSettingsModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>⚙️ System Settings</h2>

      <button
        class="close-btn"
        onclick="closeModal('systemSettingsModal')"
      >
        ×
      </button>

    </div>

    <form id="systemSettingsForm">

      <div class="settings-grid">

        <div class="form-group">
          <label>Free Trial Days</label>
          <input type="number" id="freeTrialDays">
        </div>

        <div class="form-group">
          <label>1 Term Price (₦)</label>
          <input type="number" id="oneTermPrice">
        </div>

        <div class="form-group">
          <label>2 Terms Price (₦)</label>
          <input type="number" id="twoTermsPrice">
        </div>

        <div class="form-group">
          <label>1 Session Price (₦)</label>
          <input type="number" id="oneSessionPrice">
        </div>

        <div class="form-group">
          <label>Bank Name</label>
          <input type="text" id="bankName">
        </div>

        <div class="form-group">
          <label>Account Name</label>
          <input type="text" id="accountName">
        </div>

        <div class="form-group">
          <label>Account Number</label>
          <input type="text" id="accountNumber">
        </div>

        <div class="form-group">
          <label>WhatsApp / Phone for Payment Proof</label>
          <input type="text" id="payment
