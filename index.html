<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPlus School Management System</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

button,input,select,textarea{
  font:inherit;
}

.hidden{
  display:none !important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo-title{
  text-align:center;
  margin-bottom:25px;
}

.logo-title .icon{
  font-size:55px;
}

.logo-title h1{
  color:#0d47a1;
  font-size:30px;
  margin-top:5px;
}

.logo-title p{
  color:#777;
  margin-top:5px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
  color:#374151;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 3px rgba(25,118,210,.1);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:85px;
}

.show-password{
  position:absolute;
  right:8px;
  top:7px;
  border:none;
  background:#eef4ff;
  color:#0d47a1;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.primary-btn{
  width:100%;
  border:none;
  background:#0d47a1;
  color:white;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:5px;
}

.primary-btn:hover{
  background:#083b88;
}

.message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  display:none;
}

.message.error{
  display:block;
  background:#ffebee;
  color:#c62828;
}

.message.success{
  display:block;
  background:#e8f5e9;
  color:#2e7d32;
}

/* =========================
   APPLICATION
========================= */

#appPage{
  min-height:100vh;
}

.topbar{
  background:#0d47a1;
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.user-info{
  text-align:right;
  font-size:12px;
}

.user-info strong{
  display:block;
  font-size:13px;
}

.logout-btn{
  border:none;
  background:#ef5350;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  margin-left:8px;
}

.dashboard{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.welcome{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.welcome h2{
  color:#0d47a1;
  margin-bottom:5px;
}

.school-name-display{
  color:#666;
}

.section-title{
  margin:22px 0 12px;
  color:#374151;
}

.tiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.tile{
  background:white;
  border:none;
  min-height:135px;
  border-radius:16px;
  padding:18px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:.2s;
}

.tile:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(0,0,0,.12);
}

.tile .tile-icon{
  font-size:38px;
  margin-bottom:12px;
}

.tile h3{
  font-size:16px;
  color:#1f2937;
  margin-bottom:5px;
}

.tile p{
  color:#777;
  font-size:12px;
}

.placeholder{
  opacity:.75;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:22px;
  position:relative;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

.modal-header h2{
  color:#0d47a1;
  font-size:21px;
}

.close-btn{
  border:none;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

.secondary-btn{
  border:none;
  background:#e5e7eb;
  color:#374151;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.save-btn{
  border:none;
  background:#0d47a1;
  color:white;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

/* =========================
   LOGO
========================= */

.logo-upload-area{
  border:2px dashed #b8c7dd;
  border-radius:12px;
  padding:18px;
  text-align:center;
  background:#f8fbff;
  margin-top:8px;
}

.logo-preview{
  width:120px;
  height:120px;
  border-radius:12px;
  border:1px solid #ddd;
  object-fit:contain;
  background:white;
  display:none;
  margin:0 auto 12px;
}

.logo-placeholder{
  color:#777;
  font-size:13px;
  margin-bottom:12px;
}

.file-input{
  width:100%;
  padding:8px;
}

/* =========================
   SCHOOL CARDS
========================= */

.school-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  background:#fafafa;
}

.school-card h3{
  color:#0d47a1;
  margin-bottom:8px;
}

.school-card p{
  font-size:13px;
  margin:4px 0;
  color:#555;
}

/* =========================
   SETTINGS
========================= */

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px 15px;
}

.settings-grid .full{
  grid-column:1/-1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .topbar{
    flex-wrap:wrap;
  }

  .user-info{
    order:3;
    width:100%;
    text-align:left;
  }

  .tiles{
    grid-template-columns:repeat(2,1fr);
  }

  .tile{
    min-height:125px;
    padding:14px;
  }

  .tile .tile-icon{
    font-size:32px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:380px){

  .tiles{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<script>

/* =====================================================
   CURRENT EXAMPLUS WEB APP URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxrMw09DOmpuaKVyjD357asj2oQ0FYG-5eQ6I8Vt4kiRwSYearkmdhScl-xV2Ln6anLMw/exec";


let currentUser = null;


/* =====================================================
   HELPER
===================================================== */

function $(id){
  return document.getElementById(id);
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(elementId,text,type){

  const element = $(elementId);

  if(!element){
    return;
  }

  element.textContent = text;

  element.className =
    "message " + type;
}


function clearMessage(elementId){

  const element = $(elementId);

  if(!element){
    return;
  }

  element.textContent = "";

  element.className = "message";
}


/* =====================================================
   JSONP REQUEST
===================================================== */

function apiRequest(action,params={}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      "examplus_callback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement("script");

    let finished = false;

    const timeout =
      setTimeout(()=>{

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error(
            "The server did not respond. Please try again."
          )
        );

      },30000);


    function cleanup(){

      clearTimeout(timeout);

      if(script.parentNode){

        script.parentNode.removeChild(script);

      }

      try{

        delete window[callbackName];

      }catch(error){

        window[callbackName] = undefined;

      }

    }


    window[callbackName] =
      function(response){

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        if(
          response &&
          response.success === false
        ){

          reject(
            new Error(
              response.message ||
              "Request failed."
            )
          );

          return;
        }

        resolve(response);

      };


    const query =
      new URLSearchParams();


    query.set("action",action);

    query.set("callback",callbackName);


    Object.keys(params)
    .forEach(key=>{

      let value = params[key];

      if(
        value === null ||
        value === undefined
      ){

        value = "";

      }

      query.set(
        key,
        String(value)
      );

    });


    script.src =
      API_URL +
      "?" +
      query.toString();


    script.onerror =
      function(){

        if(finished){
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error(
            "Unable to connect to ExamPlus server."
          )
        );

      };


    document.body.appendChild(script);

  });

}

/* =====================================================
   RESTORE SESSION
===================================================== */

function restoreSession(){

  const saved =
    sessionStorage.getItem(
      "examplusUser"
    );


  if(!saved){
    return;
  }


  try{

    currentUser =
      JSON.parse(saved);


    if(
      currentUser &&
      currentUser.email &&
      currentUser.role
    ){

      showApp();

    }

  }catch(error){

    sessionStorage.removeItem(
      "examplusUser"
    );

  }

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

  $("loginPage")
    .classList
    .add("hidden");


  $("appPage")
    .classList
    .remove("hidden");


  $("topUserEmail")
    .textContent =
    currentUser.email || "";


  $("topUserRole")
    .textContent =
    currentUser.role || "";


  $("welcomeTitle")
    .textContent =
    "Welcome, " +
    (
      currentUser.role ||
      "User"
    );


  $("welcomeSchool")
    .textContent =
    currentUser.schoolName ||
    "ExamPlus";


  hideAllRoleSections();


  const role =
    String(
      currentUser.role ||
      ""
    )
    .toLowerCase();


  if(role === "super admin"){

    $("superAdminSection")
      .classList
      .remove("hidden");

  }

  else if(role === "admin"){

    $("adminSection")
      .classList
      .remove("hidden");

  }

  else if(role === "teacher"){

    $("teacherSection")
      .classList
      .remove("hidden");

  }

  else if(role === "bursar"){

    $("bursarSection")
      .classList
      .remove("hidden");

  }

}

/* =====================================================
   DATE FORMAT
===================================================== */

function normalizeDateForInput(value){

  if(!value){
    return "";
  }


  const text =
    String(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/
    .test(text)
  ){

    return text;

  }


  const date =
    new Date(text);


  if(isNaN(date.getTime())){

    return "";

  }


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");


  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}

$("schoolLogoInput")
.addEventListener(
  "change",
  function(){

    const file =
      this.files &&
      this.files[0];


    if(!file){
      return;
    }


    const maxSize =
      1 *
      1024 *
      1024;


    if(file.size > maxSize){

      alert(
        "Please choose a logo smaller than 1 MB."
      );

      this.value = "";

      return;

    }


    if(
      !file.type.startsWith("image/")
    ){

      alert(
        "Please select an image file."
      );

      this.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        $("schoolLogoPreview").src =
          event.target.result;

        $("schoolLogoPreview").style.display =
          "block";

        $("logoPlaceholder").style.display =
          "none";

      };


    reader.onerror =
      function(){

        alert(
          "Unable to read the logo file."
        );

      };


    reader.readAsDataURL(file);

  }
);
