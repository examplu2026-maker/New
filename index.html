<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPlus Connection Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 17px;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>ExamPlus</h2>

  <p>Frontend → Backend Test</p>

  <button onclick="testBackend()">
    TEST BACKEND
  </button>

  <div id="result">
    Waiting...
  </div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbxcMui-9QoUd9643Lca7Ss3BGPc2PvUn2fnIh2mEfTM7DvTngo6eJkH3OuDrX1xxVEK4Q/exec";


function testBackend() {

  const result =
    document.getElementById("result");

  result.innerHTML =
    "Connecting...";


  const callback =
    "examPlusTest_" + Date.now();


  const script =
    document.createElement("script");


  let finished = false;


  const timer =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      cleanup();

      result.innerHTML =
        "❌ FRONTEND CANNOT RECEIVE BACKEND RESPONSE";

    }, 15000);


  window[callback] =
    function(data) {

      if (finished) return;

      finished = true;

      clearTimeout(timer);

      cleanup();


      if (data && data.success) {

        result.innerHTML =
          "✅ FRONTEND → BACKEND WORKS<br><br>" +
          "<pre>" +
          JSON.stringify(
            data,
            null,
            2
          ) +
          "</pre>";

      } else {

        result.innerHTML =
          "⚠️ BACKEND RESPONDED<br><br>" +
          "<pre>" +
          JSON.stringify(
            data,
            null,
            2
          ) +
          "</pre>";

      }

    };


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timer);

      cleanup();

      result.innerHTML =
        "❌ BROWSER BLOCKED THE BACKEND RESPONSE";

    };


  function cleanup() {

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

    try {

      delete window[callback];

    } catch (e) {

      window[callback] = undefined;

    }

  }


  script.src =
    API +
    "?action=getClasses" +
    "&schoolId=SCH001" +
    "&callback=" +
    callback;


  document.body.appendChild(
    script
  );

}

</script>

</body>
</html>
