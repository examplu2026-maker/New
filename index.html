<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ExamPlus Login Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #1769aa;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin: 0 0 5px;
      color: #172b4d;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd3dc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1769aa;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .info {
      display: block;
      background: #eef6ff;
      color: #1769aa;
    }

    .success {
      display: block;
      background: #eaf8ef;
      color: #18743a;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .debug {
      margin-top: 15px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      font-size: 12px;
      color: #555;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">EP</div>

    <h1>ExamPlus</h1>

    <div class="subtitle">
      School Management System
    </div>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div id="status" class="status"></div>

    <div id="debug" class="debug"></div>

  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby7AmYVGIrZLHzOn8ujefghH4vFrilWN3xXE1vToiaTc1ANWia37SFV2mEvwq6pV41_Xw/exec";


const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const statusBox = document.getElementById("status");
const debugBox = document.getElementById("debug");


function showStatus(message, type) {

  statusBox.className = "status " + type;

  statusBox.textContent = message;

}


function showDebug(message) {

  debugBox.style.display = "block";

  debugBox.textContent = message;

}


async function login() {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email) {

    showStatus(
      "Please enter your email.",
      "error"
    );

    emailInput.focus();

    return;
  }


  if (!password) {

    showStatus(
      "Please enter your password.",
      "error"
    );

    passwordInput.focus();

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent = "Logging in...";

  showStatus(
    "Connecting to ExamPlus...",
    "info"
  );


  try {

    const payload = {
      action: "login",
      email: email,
      password: password
    };


    showDebug(
      "Sending login request...\n\n" +
      "Email: " + email + "\n" +
      "API connection started."
    );


    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });


    showDebug(
      "Server responded.\n\n" +
      "HTTP Status: " + response.status + "\n" +
      "Status Text: " + response.statusText
    );


    const text = await response.text();


    showDebug(
      "Server response received.\n\n" +
      "HTTP Status: " + response.status + "\n\n" +
      text
    );


    let result;

    try {

      result = JSON.parse(text);

    } catch (jsonError) {

      throw new Error(
        "The server did not return valid JSON.\n\n" +
        "Server response:\n" +
        text
      );

    }


    if (result.success) {

      showStatus(
        "Login successful! Welcome " +
        (result.user?.name ||
         result.user?.email ||
         email),
        "success"
      );


      loginButton.textContent = "Login Successful";


      /*
       * DO NOT REDIRECT YET.
       *
       * We first want to confirm that the login
       * connection is working correctly.
       */


      console.log("LOGIN SUCCESS:", result);

    } else {

      showStatus(
        result.message ||
        "Login failed. Please check your email and password.",
        "error"
      );


      loginButton.disabled = false;

      loginButton.textContent = "Login";

    }

  } catch (error) {

    console.error("LOGIN ERROR:", error);


    showStatus(
      "Login connection failed: " +
      error.message,
      "error"
    );


    showDebug(
      "LOGIN ERROR\n\n" +
      error.message +
      "\n\n" +
      "The page did NOT reload.\n" +
      "Your email and password should remain in the fields."
    );


    loginButton.disabled = false;

    loginButton.textContent = "Login";

  }

}


form.addEventListener("submit", function(event) {

  event.preventDefault();

  login();

});


</script>

</body>
</html>
