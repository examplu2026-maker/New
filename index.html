<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPlus Connection Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      padding: 30px 15px;
      text-align: center;
    }

    .box {
      max-width: 400px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    h1 {
      color: #0b5ed7;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 7px;
      background: #0b5ed7;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ExamPlus</h1>

  <p>Backend Connection Test</p>

  <input
    type="email"
    id="email"
    value="superadmin@examplus.com"
    placeholder="Email">

  <input
    type="password"
    id="password"
    value="changeMe123"
    placeholder="Password">

  <button onclick="testLogin()">
    TEST LOGIN
  </button>

  <div id="result">
    Waiting for test...
  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxcMui-9QoUd9643Lca7Ss3BGPc2PvUn2fnIh2mEfTM7DvTngo6eJkH3OuDrX1xxVEK4Q/exec";


function testLogin() {

  const result =
    document.getElementById("result");

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;


  result.innerHTML = "Testing connection...";


  const callbackName =
    "examplusTest_" +
    Date.now();


  window[callbackName] = function(data) {

    result.innerHTML =
      "<strong>CONNECTION SUCCESSFUL</strong><br><br>" +
      "<pre>" +
      JSON.stringify(data, null, 2) +
      "</pre>";


    delete window[callbackName];

  };


  const script =
    document.createElement("script");


  const url =
    API_URL +
    "?action=login" +
    "&email=" +
    encodeURIComponent(email) +
    "&password=" +
    encodeURIComponent(password) +
    "&callback=" +
    callbackName;


  script.src = url;


  script.onerror = function() {

    result.innerHTML =
      "<strong>CONNECTION FAILED</strong><br><br>" +
      "The browser could not load the Apps Script response.";

    delete window[callbackName];

  };


  document.body.appendChild(script);

}

</script>

</body>
</html>
