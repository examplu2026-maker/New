<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPlus</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:#f4f7fb;
  color:#222;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#0b5ed7,#073b8f);
}

.login-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:22px;
  padding:30px 25px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.logo-circle{
  width:78px;
  height:78px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#0b5ed7;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
}

.login-card h1{
  text-align:center;
  color:#0b5ed7;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#0b5ed7;
}

.form-group{
  margin-bottom:17px;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:10px;
  top:10px;
  border:none;
  background:none;
  color:#0b5ed7;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:10px;
  background:#0b5ed7;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  text-align:center;
  font-size:14px;
}

.error{
  display:block;
  background:#ffe5e5;
  color:#b00020;
}

.success{
  display:block;
  background:#e5f8eb;
  color:#08752d;
}

/* APP */
#app{
  display:none;
  min-height:100vh;
}

.topbar{
  background:#0b5ed7;
  color:white;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.topbar-title{
  font-size:20px;
  font-weight:bold;
}

.topbar-user{
  font-size:12px;
  opacity:.9;
}

.content{
  padding:20px;
  max-width:1000px;
  margin:auto;
}

.welcome{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.welcome h2{
  color:#0b5ed7;
  margin-bottom:5px;
}

.welcome p{
  color:#666;
  font-size:14px;
}

/* ICON DASHBOARD */
.icon-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.icon-card{
  background:white;
  border:none;
  border-radius:18px;
  padding:22px 10px;
  min-height:145px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.icon-card:active{
  transform:scale(.96);
}

.icon{
  width:65px;
  height:65px;
  margin:0 auto 12px;
  border-radius:18px;
  background:#eaf2ff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
}

.icon-card h3{
  font-size:15px;
  color:#222;
}

.icon-card p{
  font-size:11px;
  color:#888;
  margin-top:5px;
}

/* SECTIONS */
.page-section{
  display:none;
}

.page-section.active{
  display:block;
}

.back-btn{
  border:none;
  background:#e9f1ff;
  color:#0b5ed7;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:18px;
}

.section-card{
  background:white;
  border-radius:17px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.section-card h2{
  color:#0b5ed7;
  margin-bottom:18px;
}

.save-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#0b5ed7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.school-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.school-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.school-item h3{
  color:#0b5ed7;
  margin-bottom:7px;
}

.school-item p{
  font-size:13px;
  margin:4px 0;
  color:#555;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e5f8eb;
  color:#08752d;
  font-size:11px;
  font-weight:bold;
}

.settings-box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
}

.settings-box h3{
  margin-bottom:12px;
  color:#333;
}

.logout{
  width:100%;
  margin-top:25px;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#dc3545;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.loading{
  text-align:center;
  color:#0b5ed7;
  padding:15px;
  display:none;
}

@media(max-width:380px){
  .icon-grid{
    gap:10px;
  }

  .icon-card{
    min-height:135px;
    padding:18px 8px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="login-card">

    <div class="logo-circle">EP</div>

    <h1>ExamPlus</h1>

    <div class="subtitle">
      School Management System
    </div>

    <div id="loginMessage" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>

        </div>
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

      <div id="loginLoading" class="loading">
        Logging in...
      </div>

    </form>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

  <div class="topbar">

    <div>
      <div class="topbar-title">ExamPlus</div>
      <div class="topbar-user" id="topUser"></div>
    </div>

  </div>


  <div class="content">

    <!-- DASHBOARD -->

    <div id="dashboardPage" class="page-section active">

      <div class="welcome">

        <h2 id="welcomeTitle">
          Welcome
        </h2>

        <p id="welcomeSchool"></p>

      </div>


      <div class="icon-grid">

        <!-- CREATE SCHOOL -->

        <button
          class="icon-card"
          onclick="openSection('createSchoolPage')"
        >

          <div class="icon">🏫</div>

          <h3>Create School</h3>

          <p>Create a new school</p>

        </button>


        <!-- VIEW SCHOOLS -->

        <button
          class="icon-card"
          onclick="openSection('viewSchoolsPage'); loadSchools()"
        >

          <div class="icon">🏢</div>

          <h3>View Schools</h3>

          <p>View registered schools</p>

        </button>


        <!-- SETTINGS -->

        <button
          class="icon-card"
          onclick="openSection('settingsPage')"
        >

          <div class="icon">⚙️</div>

          <h3>Settings</h3>

          <p>System settings</p>

        </button>

      </div>


      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- CREATE SCHOOL -->

    <div id="createSchoolPage" class="page-section">

      <button
        class="back-btn"
        onclick="goHome()"
      >
        ← Back
      </button>

      <div class="section-card">

        <h2>🏫 Create School</h2>

        <div id="schoolMessage" class="message"></div>

        <div class="form-group">

          <label>School Name</label>

          <input
            type="text"
            id="schoolName"
            placeholder="Enter school name"
          >

        </div>


        <div class="form-group">

          <label>Admin Email</label>

          <input
            type="email"
            id="schoolEmail"
            placeholder="Enter school admin email"
          >

        </div>


        <div class="form-group">

          <label>Admin Password</label>

          <input
            type="password"
            id="schoolPassword"
            placeholder="Enter admin password"
          >

        </div>


        <button
          class="save-btn"
          onclick="createSchool()"
          id="createSchoolBtn"
        >
          Save School
        </button>

        <div
          id="schoolLoading"
          class="loading"
        >
          Creating school...
        </div>

      </div>

    </div>


    <!-- VIEW SCHOOLS -->

    <div id="viewSchoolsPage" class="page-section">

      <button
        class="back-btn"
        onclick="goHome()"
      >
        ← Back
      </button>

      <div class="section-card">

        <h2>🏢 View Schools</h2>

        <div
          id="schoolsLoading"
          class="loading"
        >
          Loading schools...
        </div>

        <div
          id="schoolsList"
          class="school-list"
        >
        </div>

      </div>

    </div>


    <!-- SETTINGS -->

    <div id="settingsPage" class="page-section">

      <button
        class="back-btn"
        onclick="goHome()"
      >
        ← Back
      </button>

      <div class="section-card">

        <h2>⚙️ Settings</h2>


        <div class="settings-box">

          <h3>Subscription Plans</h3>

          <p>Free Trial — 1 Week</p>
          <p>1 Term — ₦8,000</p>
          <p>2 Terms — ₦14,000</p>
          <p>1 Session — ₦20,000</p>

        </div>


        <div class="settings-box">

          <h3>Bank Payment</h3>

          <div class="form-group">
            <label>Account Number</label>
            <input type="text" placeholder="Account Number">
          </div>

          <div class="form-group">
            <label>Account Name</label>
            <input type="text" placeholder="Account Name">
          </div>

          <div class="form-group">
            <label>Bank Name</label>
            <input type="text" placeholder="Bank Name">
          </div>

          <div class="form-group">
            <label>WhatsApp / Phone for Proof</label>
            <input type="text" placeholder="Phone Number">
          </div>

          <button class="save-btn">
            Save Bank Settings
          </button>

        </div>


        <div class="settings-box">

          <h3>Online Payment</h3>

          <div class="form-group">
            <label>Payment Provider</label>

            <select>
              <option>Paystack</option>
              <option>None</option>
            </select>

          </div>

          <div class="form-group">
            <label>Public Key</label>
            <input type="text" placeholder="Paystack Public Key">
          </div>

          <div class="form-group">
            <label>Secret Key</label>
            <input type="password" placeholder="Paystack Secret Key">
          </div>

          <button class="save-btn">
            Save Online Payment
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   EXAMPLUS BACKEND
   ========================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwENOjw2BKVWHxsAXNFokNenNMu5-pA57HRW0C5vnnnq5Cji2jLzxS75DlOGrWPUViwwg/exec";


/* =========================================
   PASSWORD
   ========================================= */

function togglePassword(){

  const field =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");

  if(field.type === "password"){

    field.type = "text";
    button.textContent = "Hide";

  }else{

    field.type = "password";
    button.textContent = "Show";

  }

}


/* =========================================
   LOGIN MESSAGE
   ========================================= */

function showLoginMessage(text,type){

  const box =
    document.getElementById("loginMessage");

  box.textContent = text;

  box.className =
    "message " + type;

}


/* =========================================
   LOGIN
   ========================================= */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;


  const button =
    document.getElementById("loginBtn");

  const loading =
    document.getElementById("loginLoading");


  button.disabled = true;
  loading.style.display = "block";


  try{

    const url =
      BACKEND_URL +
      "?action=login" +
      "&email=" +
      encodeURIComponent(email) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if(!result.success){

      showLoginMessage(
        result.message || "Invalid email or password.",
        "error"
      );

      return;

    }


    localStorage.setItem(
      "examplusUser",
      JSON.stringify(result)
    );


    openApp(result);


  }catch(error){

    console.error(error);

    showLoginMessage(
      "Unable to connect to ExamPlus server.",
      "error"
    );

  }finally{

    button.disabled = false;
    loading.style.display = "none";

  }

});


/* =========================================
   OPEN APP
   ========================================= */

function openApp(user){

  document.getElementById("loginPage")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";


  document.getElementById("topUser")
    .textContent =
      user.role || "";


  document.getElementById("welcomeTitle")
    .textContent =
      "Welcome, " + (user.role || "User");


  document.getElementById("welcomeSchool")
    .textContent =
      user.schoolName ||
      "ExamPlus";


  /*
    At this stage we are building
    the Super Admin dashboard.
  */

}


/* =========================================
   SECTION NAVIGATION
   ========================================= */

function openSection(sectionId){

  document
    .querySelectorAll(".page-section")
    .forEach(function(section){

      section.classList.remove("active");

    });


  document
    .getElementById(sectionId)
    .classList.add("active");


  window.scrollTo(0,0);

}


function goHome(){

  openSection("dashboardPage");

}


/* =========================================
   CREATE SCHOOL
   ========================================= */

async function createSchool(){

  const name =
    document.getElementById("schoolName")
    .value.trim();

  const email =
    document.getElementById("schoolEmail")
    .value.trim();

  const password =
    document.getElementById("schoolPassword")
    .value;


  const message =
    document.getElementById("schoolMessage");

  const button =
    document.getElementById("createSchoolBtn");

  const loading =
    document.getElementById("schoolLoading");


  if(!name || !email || !password){

    message.textContent =
      "Please fill all fields.";

    message.className =
      "message error";

    return;

  }


  button.disabled = true;
  loading.style.display = "block";
  message.style.display = "none";


  try{

    const url =
      BACKEND_URL +
      "?action=createSchool" +
      "&schoolName=" +
      encodeURIComponent(name) +
      "&email=" +
      encodeURIComponent(email) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const result =
      await response.json();


    if(result.success){

      message.textContent =
        "School created successfully.";

      message.className =
        "message success";


      document.getElementById("schoolName")
        .value = "";

      document.getElementById("schoolEmail")
        .value = "";

      document.getElementById("schoolPassword")
        .value = "";

    }else{

      message.textContent =
        result.message ||
        "Unable to create school.";

      message.className =
        "message error";

    }


  }catch(error){

    console.error(error);

    message.textContent =
      "Unable to connect to the server.";

    message.className =
      "message error";

  }finally{

    button.disabled = false;
    loading.style.display = "none";

  }

}


/* =========================================
   LOAD SCHOOLS
   ========================================= */

async function loadSchools(){

  const list =
    document.getElementById("schoolsList");

  const loading =
    document.getElementById("schoolsLoading");


  list.innerHTML = "";

  loading.style.display = "block";


  /*
    The current backend foundation does not
    yet contain getSchools.

    We therefore show this message until
    that backend function is added.
  */

  setTimeout(function(){

    loading.style.display = "none";

    list.innerHTML =
      "<div class='school-item'>" +
      "<p>School list backend will be connected in the next step.</p>" +
      "</div>";

  },500);

}


/* =========================================
   LOGOUT
   ========================================= */

function logout(){

  localStorage.removeItem(
    "examplusUser"
  );

  document.getElementById("app")
    .style.display = "none";

  document.getElementById("loginPage")
    .style.display = "flex";

  document.getElementById("email")
    .value = "";

  document.getElementById("password")
    .value = "";

}


/* =========================================
   RESTORE LOGIN
   ========================================= */

window.addEventListener("load",function(){

  const saved =
    localStorage.getItem("examplusUser");


  if(saved){

    try{

      const user =
        JSON.parse(saved);

      if(user.success){

        openApp(user);

      }

    }catch(error){

      localStorage.removeItem(
        "examplusUser"
      );

    }

  }

});

</script>

</body>
</html>
