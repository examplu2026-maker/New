<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExamPlus</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.hidden {
  display: none !important;
}

/* LOGIN */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: 18px;
  padding: 30px 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,.10);
}

.logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 15px;
  border-radius: 20px;
  background: #1769aa;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.login-title {
  text-align: center;
  font-size: 28px;
  margin: 0;
}

.login-subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

.password-box {
  position: relative;
}

.password-box input {
  padding-right: 75px;
}

.show-password {
  position: absolute;
  right: 10px;
  top: 9px;
  border: none;
  background: transparent;
  color: #1769aa;
  font-weight: bold;
}

.login-button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border-radius: 9px;
  background: #1769aa;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
}

.login-button:disabled {
  opacity: .6;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
  text-align: center;
}

/* DASHBOARD */
.dashboard {
  min-height: 100vh;
}

.topbar {
  background: #1769aa;
  color: white;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar-title {
  font-size: 21px;
  font-weight: bold;
}

.logout-button {
  background: white;
  color: #1769aa;
  padding: 9px 14px;
  border-radius: 8px;
  font-weight: bold;
}

.dashboard-content {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.welcome {
  margin-bottom: 20px;
}

.welcome h2 {
  margin-bottom: 5px;
}

.welcome p {
  color: #666;
}

/* ICON TILES */
.tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.tile {
  background: #fff;
  border-radius: 15px;
  padding: 22px 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
  text-align: center;
  cursor: pointer;
  transition: .2s;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tile:active {
  transform: scale(.97);
}

.tile-icon {
  font-size: 38px;
  margin-bottom: 10px;
}

.tile-title {
  font-weight: bold;
  font-size: 15px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 1000;
}

.modal-box {
  width: 100%;
  max-width: 500px;
  background: #fff;
  border-radius: 18px;
  padding: 24px;
  max-height: 92vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.modal-header h2 {
  margin: 0;
}

.close-button {
  background: #eee;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  font-size: 20px;
}

.create-button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #1769aa;
  color: #fff;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
}

.create-button:disabled {
  opacity: .6;
}

.result-box {
  margin-top: 18px;
  padding: 15px;
  background: #eef7ee;
  border-radius: 10px;
  display: none;
  line-height: 1.8;
}

.school-list {
  margin-top: 15px;
}

.school-item {
  background: #f5f7fa;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.school-item strong {
  font-size: 17px;
}

.school-item small {
  display: block;
  margin-top: 5px;
  color: #666;
}

/* MOBILE */
@media (min-width: 700px) {
  .tiles {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">EP</div>

    <h1 class="login-title">ExamPlus</h1>

    <div class="login-subtitle">
      School Management System
    </div>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="username"
    >

    <label>Password</label>

    <div class="password-box">

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

      <button
        class="show-password"
        type="button"
        onclick="togglePassword()"
      >
        Show
      </button>

    </div>

    <button
      id="loginButton"
      class="login-button"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboardPage" class="dashboard hidden">

  <div class="topbar">

    <div class="topbar-title">
      ExamPlus
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="dashboard-content">

    <div class="welcome">

      <h2 id="dashboardTitle">
        Dashboard
      </h2>

      <p id="dashboardUser"></p>

    </div>


    <!-- SUPER ADMIN -->

    <div id="superAdminDashboard" class="hidden">

      <div class="tiles">

        <!-- CREATE SCHOOL ICON -->

        <div
          class="tile"
          onclick="openCreateSchool()"
        >

          <div class="tile-icon">
            🏫
          </div>

          <div class="tile-title">
            Create School
          </div>

        </div>


        <!-- VIEW SCHOOLS ICON -->

        <div
          class="tile"
          onclick="viewSchools()"
        >

          <div class="tile-icon">
            🏢
          </div>

          <div class="tile-title">
            View Schools
          </div>

        </div>


        <!--
