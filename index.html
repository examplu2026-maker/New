<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPlus Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f2f6fc;
    font-family:Arial,sans-serif;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px 25px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
    width:70px;
    height:70px;
    background:#0b5ed7;
    color:white;
    border-radius:18px;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

h1{
    text-align:center;
    margin:0 0 5px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:17px;
    outline:none;
}

input:focus{
    border-color:#0b5ed7;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    display:none;
    font-size:14px;
}

.error{
    display:block !important;
    background:#fff0f0;
    color:#b42318;
}

.success{
    display:block !important;
    background:#ecfdf3;
    color:#027a48;
}

#dashboard{
    display:none;
    text-align:center;
}

.logout{
    margin-top:20px;
    background:#dc3545;
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

    <div class="logo">
        EP
    </div>

    <h1>ExamPlus</h1>

    <div class="subtitle">
        School Management System
    </div>

    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Enter email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>

    </form>

    <div id="message"></div>

</div>


<div class="login-box" id="dashboard">

    <div class="logo">
        ✓
    </div>

    <h1>Login Successful</h1>

    <p id="welcome"></p>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzl_HGku3NPJ5ENjHpEWw23D4OZkE-SLCkZQmY9WAMkEfD5zSP3vh3lDAJZ_wVOt2IFdw/exec";


const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");


form.addEventListener("submit", async function(event){

    event.preventDefault();

    /*
       IMPORTANT:
       We save the values BEFORE doing anything else.
    */

    const email =
        emailInput.value;

    const password =
        passwordInput.value;


    if(!email || !password){

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    /*
       DO NOT reset the form.
       DO NOT clear the inputs.
    */

    loginButton.disabled = true;

    loginButton.textContent =
        "Logging in...";


    showMessage(
        "Checking login...",
        "success"
    );


    try{

        const response =
            await fetch(API_URL, {

                method:"POST",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:JSON.stringify({

                    action:"login",

                    email:email,

                    password:password

                })

            });


        const responseText =
            await response.text();


        console.log(
            "Apps Script response:",
            responseText
        );


        let data;


        try{

            data =
                JSON.parse(responseText);

        }catch(error){

            throw new Error(
                "Invalid response from Apps Script."
            );

        }


        if(data.success){

            /*
               ONLY NOW do we hide the login page.
            */

            document.getElementById(
                "loginBox"
            ).style.display = "none";


            document.getElementById(
                "dashboard"
            ).style.display = "block";


            document.getElementById(
                "welcome"
            ).textContent =
                "Welcome " +
                (data.user.email || email) +
                ". Role: " +
                (data.user.role || "User") +
                ". School: " +
                (data.user.schoolName || "");


        }else{

            /*
               Login failed.

               The email and password fields
               are NOT cleared.
            */

            showMessage(

                data.message ||
                "Invalid email or password.",

                "error"

            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }catch(error){

        console.error(error);


        /*
           Again, fields are NOT cleared.
        */

        showMessage(

            "Connection error: " +
            error.message,

            "error"

        );


        loginButton.disabled = false;

        loginButton.textContent =
            "Login";

    }

});


function showMessage(text,type){

    message.textContent = text;

    message.className = type;

}


function logout(){

    document.getElementById(
        "dashboard"
    ).style.display = "none";


    document.getElementById(
        "loginBox"
    ).style.display = "block";


    loginButton.disabled = false;

    loginButton.textContent =
        "Login";

    message.style.display =
        "none";

}

</script>

</body>
</html>
