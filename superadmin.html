<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPlus Super Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #222;
}

.header {
  background: #123b67;
  color: white;
  padding: 18px 15px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.login-box,
.dashboard,
.section {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.login-box {
  max-width: 430px;
  margin: 45px auto;
}

.login-box h2,
.section h2 {
  margin-top: 0;
  color: #123b67;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  background: #123b67;
  color: white;
}

.success {
  background: #16834b;
  color: white;
}

.danger {
  background: #c62828;
  color: white;
}

.secondary {
  background: #e8edf3;
  color: #123b67;
}

.login-button {
  width: 100%;
  margin-top: 20px;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.error {
  background: #ffe5e5;
  color: #a00000;
}

.ok {
  background: #e5f7ed;
  color: #08743e;
}

.user-info {
  background: #eaf1f8;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.menu button {
  min-height: 90px;
  background: white;
  border: 1px solid #d6dfe8;
  color: #123b67;
  font-weight: bold;
  box-shadow: 0 2px 7px rgba(0,0,0,0.05);
}

.menu .icon {
  display: block;
  font-size: 30px;
  margin-bottom: 7px;
}

.hidden {
  display: none !important;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action-row {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 13px;
}

th,
td {
  border: 1px solid #ddd;
  padding: 9px;
  text-align: left;
}

th {
  background: #123b67;
  color: white;
}

.table-wrap {
  overflow-x: auto;
}

.school-card {
  background: #f7f9fb;
  border: 1px solid #dfe6ed;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
}

.price-note {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
}

@media(max-width:650px) {

  .menu {
    grid-template-columns: 1fr 1fr;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  table {
    min-width: 700px;
  }
}

</style>
</head>

<body>

<div class="header">
  <h1>ExamPlus</h1>
  <p>Super Admin Dashboard</p>
</div>


<!-- LOGIN -->

<div id="loginScreen" class="container">

  <div class="login-box">

    <h2>Super Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Enter email"
    >

    <label>Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Enter password"
    >

    <button
      class="primary login-button"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboardScreen" class="container hidden">

  <div class="dashboard">

    <div class="user-info">
      <strong>Logged in as:</strong>
      <span id="userEmail"></span>
      <br>
      <strong>Role:</strong>
      <span id="userRole">Super Admin</span>
    </div>


    <!-- MENU -->

    <div class="menu">

      <button onclick="showSection('createSchoolSection')">
        <span class="icon">🏫</span>
        Create School
      </button>

      <button onclick="showSection('schoolsSection'); loadSchools();">
        <span class="icon">🏢</span>
        View Schools
      </button>

      <button onclick="showSection('settingsSection'); loadSettings();">
        <span class="icon">⚙️</span>
        System Settings
      </button>

    </div>


    <!-- CREATE SCHOOL -->

    <div
      id="createSchoolSection"
      class="section hidden"
    >

      <h2>🏫 Create School</h2>

      <label>School Name</label>
      <input
        type="text"
        id="schoolName"
        placeholder="Enter school name"
      >

      <label>School Admin Email</label>
      <input
        type="email"
        id="adminEmail"
        placeholder="Enter admin email"
      >

      <label>School Admin Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Create admin password"
      >

      <div class="action-row">

        <button
          class="success"
          onclick="createSchool()"
        >
          Create School
        </button>

        <button
          class="secondary"
          onclick="clearSchoolForm()"
        >
          Clear
        </button>

      </div>

      <div
        id="createSchoolMessage"
        class="message"
      ></div>

    </div>


    <!-- VIEW SCHOOLS -->

    <div
      id="schoolsSection"
      class="section hidden"
    >

      <h2>🏢 Registered Schools</h2>

      <button
        class="primary"
        onclick="loadSchools()"
      >
        Refresh Schools
      </button>

      <div
        id="schoolsMessage"
        class="message"
      ></div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>School ID</th>
              <th>School Name</th>
              <th>Admin Email</th>
              <th>Status</th>
              <th>Trial Start</th>
              <th>Trial End</th>
            </tr>

          </thead>

          <tbody id="schoolsTableBody">

          </tbody>

        </table>

      </div>

    </div>


    <!-- SETTINGS -->

    <div
      id="settingsSection"
      class="section hidden"
    >

      <h2>⚙️ System Settings</h2>

      <div class="form-row">

        <div>

          <label>Free Trial Days</label>

          <input
            type="number"
            id="TrialDays"
            min="1"
          >

        </div>

        <div>

          <label>1 Term Price (₦)</label>

          <input
            type="number"
            id="OneTermPrice"
          >

        </div>

      </div>


      <div class="form-row">

        <div>

          <label>2 Terms Price (₦)</label>

          <input
            type="number"
            id="TwoTermsPrice"
          >

        </div>

        <div>

          <label>1 Session Price (₦)</label>

          <input
            type="number"
            id="OneSessionPrice"
          >

        </div>

      </div>


      <label>Bank Name</label>

      <input
        type="text"
        id="BankName"
      >


      <label>Account Name</label>

      <input
        type="text"
        id="AccountName"
      >


      <label>Account Number</label>

      <input
        type="text"
        id="AccountNumber"
      >


      <label>WhatsApp / Phone for Proof of Payment</label>

      <input
        type="text"
        id="PaymentWhatsApp"
      >


      <label>Paystack Public Key</label>

      <input
        type="text"
        id="PaystackPublicKey"
      >


      <label>Paystack Enabled</label>

      <select id="PaystackEnabled">

        <option value="No">No</option>
        <option value="Yes">Yes</option>

      </select>


      <div class="action-row">

        <button
          class="success"
          onclick="saveSettings()"
        >
          Save Settings
        </button>

        <button
          class="secondary"
          onclick="loadSettings()"
        >
          Reload
        </button>

      </div>


      <div
        id="settingsMessage"
        class="message"
      ></div>

    </div>


    <div
      class="action-row"
      style="margin-top:25px;"
    >

      <button
        class="danger"
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   EXAMPLUS SUPER ADMIN
   ========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwRhE5rppFgPd6PmH0GtGLFgUjRjajurCFLjSFjQmdW_9P0wSVrzNfCgKwwilCsir9QXQ/exec";


let currentUser = null;


/* =========================================
   JSONP REQUEST
   ========================================= */

function apiRequest(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "examPlusCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 10000);

    params.callback = callbackName;

    const query =
      new URLSearchParams(params).toString();

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "The server took too long to respond."
          )
        );

      }, 20000);


    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
    }


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "Unable to connect to ExamPlus server."
          )
        );

      };


    script.src =
      API_URL + "?" + query;

    document.body.appendChild(script);

  });

}


/* =========================================
   LOGIN
   ========================================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Please enter your email and password.",
      false
    );

    return;
  }


  showMessage(
    "loginMessage",
    "Logging in...",
    true
  );


  try {

    const result =
      await apiRequest({

        action: "login",

        email: email,

        password: password

      });


    if (
      result &&
      result.success
    ) {

      currentUser =
        result.user;


      localStorage.setItem(
        "examplus_superadmin",
        JSON.stringify(
          currentUser
        )
      );


      document
        .getElementById(
          "loginScreen"
        )
        .classList.add("hidden");


      document
        .getElementById(
          "dashboardScreen"
        )
        .classList.remove("hidden");


      document
        .getElementById(
          "userEmail"
        )
        .textContent =
        currentUser.email;


      document
        .getElementById(
          "userRole"
        )
        .textContent =
        currentUser.role;


      showSection(
        "createSchoolSection"
      );

    } else {

      showMessage(
        "loginMessage",
        result.message ||
        "Login failed.",
        false
      );

    }

  } catch (error) {

    showMessage(
      "loginMessage",
      error.message,
      false
    );

  }

}


/* =========================================
   CREATE SCHOOL
   ========================================= */

async function createSchool() {

  const schoolName =
    document
      .getElementById("schoolName")
      .value
      .trim();

  const adminEmail =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const adminPassword =
    document
      .getElementById("adminPassword")
      .value;


  if (
    !schoolName ||
    !adminEmail ||
    !adminPassword
  ) {

    showMessage(
      "createSchoolMessage",
      "Please fill all school fields.",
      false
    );

    return;
  }


  showMessage(
    "createSchoolMessage",
    "Creating school...",
    true
  );


  try {

    const result =
      await apiRequest({

        action: "createSchool",

        schoolName:
          schoolName,

        adminEmail:
          adminEmail,

        adminPassword:
          adminPassword

      });


    if (
      result &&
      result.success
    ) {

      showMessage(
        "createSchoolMessage",

        "School created successfully. " +
        "School ID: " +
        result.school.schoolID,

        true
      );


      clearSchoolForm();


    } else {

      showMessage(
        "createSchoolMessage",

        result.message ||
        "Unable to create school.",

        false
      );

    }

  } catch (error) {

    showMessage(
      "createSchoolMessage",
      error.message,
      false
    );

  }

}


/* =========================================
   LOAD SCHOOLS
   ========================================= */

async function loadSchools() {

  showMessage(
    "schoolsMessage",
    "Loading schools...",
    true
  );


  try {

    const result =
      await apiRequest({

        action: "getSchools"

      });


    if (
      !result ||
      !result.success
    ) {

      showMessage(
        "schoolsMessage",

        result.message ||
        "Unable to load schools.",

        false
      );

      return;
    }


    const tbody =
      document
        .getElementById(
          "schoolsTableBody"
        );


    tbody.innerHTML = "";


    if (
      !result.schools ||
      result.schools.length === 0
    ) {

      tbody.innerHTML =
        "<tr>" +
        "<td colspan='6'>" +
        "No schools have been registered yet." +
        "</td>" +
        "</tr>";

    } else {

      result.schools.forEach(
        function(school) {

          const tr =
            document.createElement("tr");


          tr.innerHTML =

            "<td>" +
            escapeHtml(
              school.schoolID
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              school.schoolName
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              school.adminEmail
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              school.status
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              school.trialStartDate
            ) +
            "</td>" +

            "<td>" +
            escapeHtml(
              school.trialEndDate
            ) +
            "</td>";


          tbody.appendChild(tr);

        }
      );

    }


    showMessage(
      "schoolsMessage",
      "Schools loaded successfully.",
      true
    );


  } catch (error) {

    showMessage(
      "schoolsMessage",
      error.message,
      false
    );

  }

}


/* =========================================
   LOAD SETTINGS
   ========================================= */

async function loadSettings() {

  showMessage(
    "settingsMessage",
    "Loading settings...",
    true
  );


  try {

    const result =
      await apiRequest({

        action:
          "getSystemSettings"

      });


    if (
      !result ||
      !result.success
    ) {

      showMessage(
        "settingsMessage",

        result.message ||
        "Unable to load settings.",

        false
      );

      return;
    }


    const s =
      result.settings || {};


    setValue(
      "TrialDays",
      s.TrialDays || 7
    );

    setValue(
      "OneTermPrice",
      s.OneTermPrice || 8000
    );

    setValue(
      "TwoTermsPrice",
      s.TwoTermsPrice || 14000
    );

    setValue(
      "OneSessionPrice",
      s.OneSessionPrice || 20000
    );

    setValue(
      "BankName",
      s.BankName || ""
    );

    setValue(
      "AccountName",
      s.AccountName || ""
    );

    setValue(
      "AccountNumber",
      s.AccountNumber || ""
    );

    setValue(
      "PaymentWhatsApp",
      s.PaymentWhatsApp || ""
    );

    setValue(
      "PaystackPublicKey",
      s.PaystackPublicKey || ""
    );

    setValue(
      "PaystackEnabled",
      s.PaystackEnabled || "No"
    );


    showMessage(
      "settingsMessage",
      "Settings loaded.",
      true
    );


  } catch (error) {

    showMessage(
      "settingsMessage",
      error.message,
      false
    );

  }

}


/* =========================================
   SAVE SETTINGS
   ========================================= */

async function saveSettings() {

  showMessage(
    "settingsMessage",
    "Saving settings...",
    true
  );


  try {

    const result =
      await apiRequest({

        action:
          "saveSystemSettings",

        TrialDays:
          getValue("TrialDays"),

        OneTermPrice:
          getValue("OneTermPrice"),

        TwoTermsPrice:
          getValue("TwoTermsPrice"),

        OneSessionPrice:
          getValue("OneSessionPrice"),

        BankName:
          getValue("BankName"),

        AccountName:
          getValue("AccountName"),

        AccountNumber:
          getValue("AccountNumber"),

        PaymentWhatsApp:
          getValue("PaymentWhatsApp"),

        PaystackPublicKey:
          getValue("PaystackPublicKey"),

        PaystackEnabled:
          getValue("PaystackEnabled")

      });


    if (
      result &&
      result.success
    ) {

      showMessage(
        "settingsMessage",
        "System settings saved successfully.",
        true
      );

    } else {

      showMessage(
        "settingsMessage",

        result.message ||
        "Unable to save settings.",

        false
      );

    }

  } catch (error) {

    showMessage(
      "settingsMessage",
      error.message,
      false
    );

  }

}


/* =========================================
   SECTION
   ========================================= */

function showSection(id) {

  const sections =
    document.querySelectorAll(
      ".section"
    );


  sections.forEach(
    function(section) {

      section.classList.add(
        "hidden"
      );

    }
  );


  document
    .getElementById(id)
    .classList.remove("hidden");

}


/* =========================================
   CLEAR SCHOOL FORM
   ========================================= */

function clearSchoolForm() {

  document
    .getElementById("schoolName")
    .value = "";

  document
    .getElementById("adminEmail")
    .value = "";

  document
    .getElementById("adminPassword")
    .value = "";

}


/* =========================================
   LOGOUT
   ========================================= */

function logout() {

  localStorage.removeItem(
    "examplus_superadmin"
  );

  currentUser = null;

  document
    .getElementById(
      "dashboardScreen"
    )
    .classList.add("hidden");


  document
    .getElementById(
      "loginScreen"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "loginPassword"
    )
    .value = "";

}


/* =========================================
   HELPERS
   ========================================= */

function getValue(id) {

  return document
    .getElementById(id)
    .value;

}


function setValue(id, value) {

  document
    .getElementById(id)
    .value = value;

}


function showMessage(
  id,
  text,
  success
) {

  const box =
    document.getElementById(id);

  box.textContent = text;

  box.style.display = "block";

  box.className =
    "message " +
    (
      success
        ? "ok"
        : "error"
    );

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================
   RESTORE LOGIN
   ========================================= */

window.addEventListener(
  "load",
  function() {

    try {

      const saved =
        localStorage.getItem(
          "examplus_superadmin"
        );


      if (!saved) {
        return;
      }


      const user =
        JSON.parse(saved);


      if (
        !user ||
        !user.email
      ) {
        return;
      }


      currentUser = user;


      document
        .getElementById(
          "loginScreen"
        )
        .classList.add("hidden");


      document
        .getElementById(
          "dashboardScreen"
        )
        .classList.remove("hidden");


      document
        .getElementById(
          "userEmail"
        )
        .textContent =
        user.email;


      document
        .getElementById(
          "userRole"
        )
        .textContent =
        user.role ||
        "Super Admin";


      showSection(
        "createSchoolSection"
      );


    } catch (error) {

      localStorage.removeItem(
        "examplus_superadmin"
      );

    }

  }
);

</script>

</body>
</html>
