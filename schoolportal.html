<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ExamPlus School Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: #0d47a1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,0.1);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0d47a1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #08367c;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back {
      margin-top: 15px;
      background: #eee;
      color: #333;
    }

    .back:hover {
      background: #ddd;
    }

    #message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block !important;
      background: #ffebee;
      color: #c62828;
    }

    .success {
      display: block !important;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .loading {
      text-align: center;
      color: #777;
      margin-top: 12px;
      display: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">EP</div>

      <h1>ExamPlus</h1>

      <div class="subtitle">
        School Admin Portal
      </div>

      <div id="message"></div>

      <form id="loginForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
          autocomplete="username"
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        >

        <button type="submit" id="loginButton">
          Login
        </button>

      </form>

      <div id="loading" class="loading">
        Logging in, please wait...
      </div>

      <button
        type="button"
        class="back"
        onclick="goHome()"
      >
        ← Back to ExamPlus
      </button>

    </div>

  </div>


<script>

  /*
   * ExamPlus School Admin Web App
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzfvwRYbw5RlljMQ09wNm9jFo0vyM-Q475BxApZqwha0t55a1m16zY3AyMa2fdsP7UIVA/exec";


  /*
   * Show message
   */

  function showMessage(message, type) {

    const box = document.getElementById("message");

    box.textContent = message;

    box.className = type || "";

  }


  /*
   * Loading state
   */

  function setLoading(isLoading) {

    const button =
      document.getElementById("loginButton");

    const loading =
      document.getElementById("loading");

    if (isLoading) {

      button.disabled = true;

      button.textContent = "Logging in...";

      loading.style.display = "block";

    } else {

      button.disabled = false;

      button.textContent = "Login";

      loading.style.display = "none";

    }

  }


  /*
   * JSONP login
   *
   * JSONP is used because the frontend
   * is hosted on GitHub Pages while
   * Google Apps Script is another domain.
   */

  function loginWithJSONP(email, password) {

    return new Promise(function(resolve, reject) {

      const callbackName =
        "examPlusSchoolLogin_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      const script =
        document.createElement("script");

      const timeout =
        setTimeout(function() {

          cleanup();

          reject(
            new Error(
              "Login request timed out. Please check your internet connection."
            )
          );

        }, 20000);


      function cleanup() {

        clearTimeout(timeout);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

      }


      window[callbackName] = function(response) {

        cleanup();

        resolve(response);

      };


      script.onerror = function() {

        cleanup();

        reject(
          new Error(
            "Unable to connect to the ExamPlus server."
          )
        );

      };


      const url =
        API_URL +
        "?action=schoolAdminLogin" +
        "&email=" +
        encodeURIComponent(email) +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();


      script.src = url;

      document.body.appendChild(script);

    });

  }


  /*
   * Login form
   */

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      showMessage("", "");

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }


      setLoading(true);


      try {

        const response =
          await loginWithJSONP(
            email,
            password
          );


        console.log(
          "School Admin Login Response:",
          response
        );


        if (
          !response ||
          response.success !== true
        ) {

          showMessage(
            response &&
            response.message
              ? response.message
              : "Login failed. Please check your login details.",
            "error"
          );

          setLoading(false);

          return;

        }


        /*
         * Confirm that this is actually
         * a School Admin account.
         */

        const role =
          String(
            response.role || ""
          )
          .toLowerCase()
          .trim();


        if (
          role !== "admin" &&
          role !== "schooladmin"
        ) {

          showMessage(
            "This account is not a School Admin account.",
            "error"
          );

          setLoading(false);

          return;

        }


        /*
         * Save login information
         */

        localStorage.setItem(
          "examplus_schooladmin_email",
          response.email || email
        );

        localStorage.setItem(
          "examplus_schooladmin_role",
          role
        );

        localStorage.setItem(
          "examplus_schoolID",
          response.schoolID || ""
        );

        localStorage.setItem(
          "examplus_schoolId",
          response.schoolID || ""
        );

        localStorage.setItem(
          "examplus_schoolName",
          response.schoolName || ""
        );


        showMessage(
          "Login successful. Opening School Admin Dashboard...",
          "success"
        );


        /*
         * Open School Admin dashboard
         */

        setTimeout(function() {

          window.location.href =
            "schooladmin.html";

        }, 700);


      } catch (error) {

        console.error(
          "Login Error:",
          error
        );

        showMessage(
          error.message ||
          "Unable to login. Please try again.",
          "error"
        );

        setLoading(false);

      }

    });


  /*
   * Back to homepage
   */

  function goHome() {

    window.location.href =
      "index.html";

  }

</script>

</body>
</html>
