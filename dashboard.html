<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAMPLUS — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="shell">

    <aside class="sidebar">
      <div class="sidebar-mark">
        <span class="login-mark-glyph">E</span>
        <span class="login-mark-text">EXAMPLUS</span>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sidebarName">—</div>
        <div class="sidebar-user-role" id="sidebarRole">—</div>
        <button class="signout-btn" id="signoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Overview</h1>
        <div class="topbar-school" id="topbarSchool"></div>
      </header>

      <div id="panels"></div>
    </main>

  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script>
    const session = requireSession(); // redirects to index.html if not signed in
    initDashboard(session);
  </script>
</body>
</html>
